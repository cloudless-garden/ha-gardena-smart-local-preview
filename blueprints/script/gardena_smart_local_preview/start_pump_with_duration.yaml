blueprint:
  name: Start GARDENA pump (with duration)
  description: >-
    Starts a GARDENA pump, optionally overriding its
    configured duration for this run only.
  domain: script
  source_url: https://github.com/cloudless-garden/ha-gardena-smart-local-preview/blob/main/blueprints/script/gardena_smart_local_preview/start_pump_with_duration.yaml
  input:
    pump:
      name: Pump
      description: The pump to start.
      selector:
        entity:
          filter:
            integration: gardena_smart_local_preview
            domain: switch

fields:
  duration:
    name: Duration
    description: How long to run the pump.
    required: false
    selector:
      duration:
        enable_day: false

sequence:
  - action: gardena_smart_local_preview.start_pump
    target:
      entity_id: !input pump
    data:
      # Calling the script without the fields form (e.g. the dashboard row's
      # play icon) passes duration as None instead of omitting it, so
      # default(none, true) normalizes both cases to None first. The
      # duration selector gives back an {hours, minutes, seconds} dict;
      # the start_pump service itself wants a plain number of seconds.
      duration: >-
        {% set d = duration | default(none, true) %}{{ omit if d is none else
        ((d.hours | default(0) | int) * 3600 + (d.minutes | default(0) | int) * 60 +
        (d.seconds | default(0) | int)) }}
