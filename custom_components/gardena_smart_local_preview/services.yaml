open_valve:
  target:
    entity:
      integration: gardena_smart_local_preview
      domain: valve
  fields:
    duration:
      required: false
      example: 900
      selector:
        number:
          min: 60
          max: 10800
          unit_of_measurement: s
          mode: box

enable_output:
  target:
    entity:
      integration: gardena_smart_local_preview
      domain: switch
  fields:
    duration:
      required: false
      example: 900
      selector:
        number:
          min: 1
          unit_of_measurement: s
          mode: box

start_pump:
  target:
    entity:
      integration: gardena_smart_local_preview
      domain: switch
  fields:
    duration:
      required: false
      example: 900
      selector:
        number:
          min: 60
          max: 5400
          unit_of_measurement: s
          mode: box

start_mowing:
  target:
    entity:
      integration: gardena_smart_local_preview
      domain: lawn_mower
  fields:
    duration:
      required: false
      example: 2
      selector:
        number:
          min: 1
          max: 6
          unit_of_measurement: h
          mode: box
